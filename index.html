<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // ATHG: o jogo só é acessado pela plataforma. Aberto fora de um iframe
      // (link direto, PWA instalado), redireciona para o player da ATHG. Dev local continua livre.
      (function () {
        var h = location.hostname;
        var local = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || /\.local$/.test(h) ||
          /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h) || location.protocol === 'file:';
        if (window.top === window.self && !local) {
          document.documentElement.style.display = 'none';
          location.replace('https://athg.antonycorp11.workers.dev/play/vaelmor');
        }
      })();
    </script>
    <script>
      // ATHG Modo Gravação: com o foco no jogo, ⌘1/⌘2/⌘3 (Ctrl no Windows) trocam a cena do
      // estúdio. Só liga quando o estúdio da ATHG avisa; no player normal nada muda.
      (function () {
        if (window.top === window.self) return;
        var studio = false;
        addEventListener('message', function (e) {
          if (e.source === window.parent && e.data && e.data.type === 'ATHG_STUDIO_ON') studio = true;
        });
        addEventListener('keydown', function (e) {
          if (!studio || !(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey || ['1', '2', '3'].indexOf(e.key) < 0) return;
          e.preventDefault();
          window.parent.postMessage({ type: 'ATHG_STUDIO_KEY', key: e.key }, '*');
        }, true);
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Vaelmor</title>
    <meta name="description" content="Vaelmor — protótipo 2D top-down em pixel art" />
    <meta name="theme-color" content="#2a2650" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vaelmor" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/tiny5-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* fonte da interface (Tiny5, SIL OFL), embutida para funcionar offline */
      @font-face {
        font-family: 'Tiny5';
        src: url('./fonts/tiny5-latin.woff2') format('woff2');
        /* um peso só: a faixa evita o negrito falso (que borra os números) */
        font-weight: 400 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1a24;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      #safe-probe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #2a2650;
        color: #fff;
        font: bold 18px/1.4 monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
      }
      #rotate .phone {
        width: 46px;
        height: 78px;
        border: 4px solid #ffd34a;
        border-radius: 8px;
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-probe"></div>
    <div id="rotate" role="alert">
      <div class="phone"></div>
      <div>Gire o aparelho<br />para jogar</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
