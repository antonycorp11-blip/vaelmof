[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# o service worker e o manifest não devem ficar presos em cache HTTP
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# ATHG: só a plataforma (e o próprio jogo / dev local) pode exibir o jogo em iframe
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://athg.antonycorp11.workers.dev http://localhost:*"
    X-Content-Type-Options = "nosniff"
